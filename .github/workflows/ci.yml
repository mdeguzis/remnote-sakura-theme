name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npm test

      # The artwork is committed. If a regeneration would change it, the
      # committed files and the generator have drifted apart.
      - name: Artwork is up to date
        run: |
          npm run art
          git diff --exit-code -- assets/ logo.png

      # theme.css and manifest.json are committed so the repo is itself a
      # valid RemNote theme. Regenerating must not change them.
      - name: Theme output is up to date
        run: |
          node scripts/build-theme.mjs
          git diff --exit-code -- theme.css manifest.json

      - name: Build both zips
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sakura-zips
          path: |
            SakuraTheme.zip
            SakuraPlugin.zip
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
